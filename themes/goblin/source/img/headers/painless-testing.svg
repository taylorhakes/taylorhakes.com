<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bfa5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="800" y1="0" x2="800" y2="600" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <line x1="1000" y1="0" x2="1000" y2="600" stroke="#fff" stroke-width="1" opacity="0.05"/>
  <!-- Checkmarks -->
  <g transform="translate(250,180)" opacity="0.3">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M-18 0 L-6 12 L18 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(600,280)" opacity="0.5">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M-24 0 L-8 16 L24 -16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(950,200)" opacity="0.3">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M-18 0 L-6 12 L18 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Test output lines -->
  <g transform="translate(150,420)" opacity="0.2">
    <rect x="0" y="0" width="300" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="24" width="240" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="48" width="280" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="72" width="200" height="16" rx="3" fill="#a5d6a7"/>
  </g>
  <g transform="translate(700,400)" opacity="0.15">
    <rect x="0" y="0" width="260" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="24" width="320" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="48" width="220" height="16" rx="3" fill="#fff"/>
    <rect x="0" y="72" width="280" height="16" rx="3" fill="#a5d6a7"/>
  </g>
</svg>
