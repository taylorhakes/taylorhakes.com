<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f57f17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Speed gauge -->
  <g transform="translate(600,350)">
    <path d="M-180 0 A180 180 0 0 1 180 0" fill="none" stroke="#fff" stroke-width="4" opacity="0.2"/>
    <path d="M-160 0 A160 160 0 0 1 160 0" fill="none" stroke="#fff" stroke-width="2" opacity="0.1"/>
    <!-- Gauge marks -->
    <line x1="-170" y1="-30" x2="-150" y2="-26" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="-155" y1="-75" x2="-137" y2="-66" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="-127" y1="-127" x2="-113" y2="-113" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="-75" y1="-155" x2="-66" y2="-137" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-180" x2="0" y2="-160" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="75" y1="-155" x2="66" y2="-137" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="127" y1="-127" x2="113" y2="-113" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="155" y1="-75" x2="137" y2="-66" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="170" y1="-30" x2="150" y2="-26" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <!-- Needle pointing to fast -->
    <line x1="0" y1="0" x2="110" y2="-100" stroke="#fff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#fff" opacity="0.4"/>
  </g>
  <!-- Performance bars -->
  <g transform="translate(80,100)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="280" height="12" rx="6" fill="#fff3e0"/>
  </g>
  <g transform="translate(80,130)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="180" height="12" rx="6" fill="#fff3e0"/>
  </g>
  <g transform="translate(80,160)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="90" height="12" rx="6" fill="#fff3e0"/>
  </g>
  <g transform="translate(820,100)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="60" height="12" rx="6" fill="#c8e6c9"/>
  </g>
  <g transform="translate(820,130)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="40" height="12" rx="6" fill="#c8e6c9"/>
  </g>
  <g transform="translate(820,160)" opacity="0.15">
    <rect x="0" y="0" width="300" height="12" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="25" height="12" rx="6" fill="#c8e6c9"/>
  </g>
  <!-- Lightning bolt -->
  <g transform="translate(560,80)" opacity="0.15">
    <polygon points="40,0 15,50 35,50 20,90 60,35 38,35 55,0" fill="#fff"/>
  </g>
</svg>
