<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Clock face -->
  <g transform="translate(600,300)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#fff" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="155" fill="none" stroke="#fff" stroke-width="1" opacity="0.1"/>
    <!-- Hour markers -->
    <line x1="0" y1="-140" x2="0" y2="-125" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="70" y1="-121" x2="62" y2="-108" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="121" y1="-70" x2="108" y2="-62" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="140" y1="0" x2="125" y2="0" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="121" y1="70" x2="108" y2="62" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="70" y1="121" x2="62" y2="108" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="0" y1="140" x2="0" y2="125" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="-70" y1="121" x2="-62" y2="108" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="-121" y1="70" x2="-108" y2="62" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="-140" y1="0" x2="-125" y2="0" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="-121" y1="-70" x2="-108" y2="-62" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <line x1="-70" y1="-121" x2="-62" y2="-108" stroke="#fff" stroke-width="3" opacity="0.4"/>
    <!-- Hands -->
    <line x1="0" y1="10" x2="0" y2="-85" stroke="#fff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="70" y2="-50" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="90" y2="50" stroke="#42a5f5" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#42a5f5" opacity="0.7"/>
  </g>
  <!-- Interval ticks along bottom -->
  <g transform="translate(100,520)" opacity="0.2">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="100" y1="-10" x2="100" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="200" y1="-10" x2="200" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="300" y1="-10" x2="300" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="400" y1="-10" x2="400" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="500" y1="-10" x2="500" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="600" y1="-10" x2="600" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="700" y1="-10" x2="700" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="800" y1="-10" x2="800" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="900" y1="-10" x2="900" y2="10" stroke="#42a5f5" stroke-width="2"/>
    <line x1="1000" y1="-10" x2="1000" y2="10" stroke="#42a5f5" stroke-width="2"/>
  </g>
  <!-- Code hint -->
  <text x="130" y="120" font-family="monospace" font-size="14" fill="#fff" opacity="0.08">setInterval(() =&gt; tick(), 1000)</text>
</svg>
