<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b263b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- React atom -->
  <g transform="translate(600,300)">
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.4" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.4" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="16" fill="#61dafb" opacity="0.6"/>
  </g>
  <!-- Outer orbit rings -->
  <g transform="translate(600,300)" opacity="0.15">
    <ellipse cx="0" cy="0" rx="280" ry="100" fill="none" stroke="#61dafb" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="280" ry="100" fill="none" stroke="#61dafb" stroke-width="1" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="280" ry="100" fill="none" stroke="#61dafb" stroke-width="1" transform="rotate(-60)"/>
  </g>
  <!-- Small dots along orbits -->
  <circle cx="780" cy="300" r="4" fill="#61dafb" opacity="0.5"/>
  <circle cx="420" cy="300" r="4" fill="#61dafb" opacity="0.5"/>
  <circle cx="690" cy="145" r="4" fill="#61dafb" opacity="0.5"/>
  <circle cx="510" cy="455" r="4" fill="#61dafb" opacity="0.5"/>
  <circle cx="510" cy="145" r="4" fill="#61dafb" opacity="0.5"/>
  <circle cx="690" cy="455" r="4" fill="#61dafb" opacity="0.5"/>
  <!-- JSX code hints -->
  <text x="80" y="150" font-family="monospace" font-size="16" fill="#61dafb" opacity="0.12">&lt;Component /&gt;</text>
  <text x="900" y="500" font-family="monospace" font-size="16" fill="#61dafb" opacity="0.12">render()</text>
  <text x="80" y="500" font-family="monospace" font-size="14" fill="#61dafb" opacity="0.08">setState()</text>
  <text x="950" y="150" font-family="monospace" font-size="14" fill="#61dafb" opacity="0.08">props</text>
</svg>
